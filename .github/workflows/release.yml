name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true

      - name: Validate release version
        id: release_version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${TAG#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vX.Y.Z format: $TAG" >&2
            exit 1
          fi

          project_version="$(awk -F= '
            /^[[:space:]]*pluginVersion[[:space:]]*=/ {
              value = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
              print value
              exit
            }
          ' gradle.properties)"

          if [[ -z "$project_version" ]]; then
            echo "pluginVersion is missing from gradle.properties" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match pluginVersion $project_version" >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Prepare release notes and assets
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]] || ! awk 'NF { found = 1 } END { exit !found }' release-notes.md; then
            echo "No release notes found for version $VERSION in CHANGELOG.md" >&2
            exit 1
          fi

          shopt -s nullglob
          artifacts=(build/distributions/*-"$VERSION".zip)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No plugin ZIP found for version $VERSION in build/distributions" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases cannot be reused" >&2
            exit 1
          fi

          gh release create "$TAG" build/distributions/*-"$VERSION".zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
